<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather</title>
    <script type="module" src="./weather-main.js" defer></script>
    <style>
        div {
            border: solid 2px black;
            background-color: aliceblue;
            color: navy;
            border-radius: 20px;
            box-shadow: 10px 10px 10px darkgray;
            max-width: 300px;
            margin: 0 auto;
            padding: 2rem;
            transition: transform 1.1s ease, background-color 0.5 ease, border 0.1s ease;
        }

        div:hover {
            transform: scale(1.05);
            background-color: aqua;
            border: 0;
        }
        section {
            width: 200px;
            height: 200px;
            background-color: aliceblue;
            margin: 100px auto;
        }
        .animate-fade {
            animation: fadeIn 0.5 ease;
        }
        .animate-pop {
            animation: popIn 0.5 ease;
        }
    </style>
</head>
<body>
    <div id="weather">
        <h2> Location (icon)</h2>
        <h3>Current Condition</h3>
        <h3>Temperature</h3>
        <h3>Windspeed</h3>
    </div>
    <section class="animate-fade">

    </section>
    <section class="animate-pop">

    </section>
</body>
</html>
